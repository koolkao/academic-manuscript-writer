name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit, regression, rule-sync, and golden tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify worked examples
        run: |
          python3 scripts/check_manuscript.py examples/clinical-cohort
          python3 scripts/check_manuscript.py examples/computational-method
